<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">One upload, with the blob role removed</title>
<desc id="d">A numbered run of POST /upload/hello.txt across five lanes: Users, Web app, Managed identity, Blob Storage and Logs. Ingress, Flask and SaveUpload check the request on the web app lane (steps 2 to 4). Step 5 asks the managed identity for a token. Step 6 writes to Blob Storage. With the role, step 6a ends in 201 saved. Without it, step 6b is a 403 AuthorizationPermissionMismatch, and step 7 turns it into a 502 upstream_access_denied for Users. Step 8 writes one JSON log line to Logs.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="899" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="898" rx="16"/>
<text class="title" x="48" y="68">One upload, with the blob role removed</text>
<text class="caption" x="48" y="100">One upload: the happy path ends in 201, the warning rows show a removed role becoming a 502.</text>
<rect class="actor" x="400" y="128" width="120" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">Users</text>
<rect class="svc" x="550" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="610" y="158" text-anchor="middle">Web app</text>
<rect class="svc" x="710" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="770" y="148" text-anchor="middle">Managed</text>
<text class="lane" x="770" y="168" text-anchor="middle">identity</text>
<rect class="svc" x="865" y="128" width="150" height="48" rx="10"/>
<text class="lane" x="940" y="158" text-anchor="middle">Blob Storage</text>
<rect class="svc" x="1028" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1088" y="158" text-anchor="middle">Logs</text>
<path class="hair" d="M460 176V744M610 176V808M770 176V488M940 176V680M1088 176V808"/>
<path class="hair" d="M66 216V792"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">The client uploads</text>
<text class="sub" x="96" y="232">POST /upload/hello.txt</text>
<path class="sync" d="M460 216H610"/>
<text class="label t-accent" x="476" y="206">POST /upload</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Ingress ends TLS</text>
<text class="sub" x="96" y="296">scales a replica from zero</text>
<rect class="slot" x="604" y="262" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="285">ingress</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">Flask checks the size</text>
<text class="sub" x="96" y="360">over MAX_UPLOAD_BYTES: 413</text>
<rect class="slot" x="604" y="326" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="349">413 if too big</text>
<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">SaveUpload validates</text>
<text class="sub" x="96" y="424">BlobName (400), size again</text>
<rect class="slot" x="604" y="390" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="413">BlobName</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">The SDK gets a token</text>
<text class="sub" x="96" y="488">DefaultAzureCredential, no key</text>
<path class="sync" d="M610 472 H770"/>
<text class="label t-accent" x="626" y="462">AZURE_CLIENT_ID</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="532">Storage checks the role</text>
<text class="sub" x="96" y="552">scope: the uploads container</text>
<path class="sync" d="M610 536H940"/>
<text class="label t-accent" x="786" y="526">upload_blob</text>
<circle class="dot-g" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6a</text>
<text class="label b t-ink" x="96" y="596">Contributor: 201</text>
<text class="sub" x="96" y="616">the blob is written</text>
<path class="ok" d="M940 600H610"/>
<text class="label t-good" x="626" y="590">201</text>
<rect class="win" x="472" y="580" width="118" height="40" rx="10"/>
<text class="label b t-good" x="488" y="605">201 saved</text>
<circle class="dot-w" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">6b</text>
<text class="label b t-warn" x="96" y="660">No role: 403</text>
<text class="sub" x="96" y="680">AuthorizationPermissionMismatch</text>
<path class="fail" d="M940 664H610"/>
<text class="label t-warn" x="626" y="654">403</text>
<circle class="dot-w" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">7</text>
<text class="label b t-warn" x="96" y="724">403 becomes 502</text>
<text class="sub" x="96" y="744">AccessDeniedError, not a 403</text>
<path class="fail" d="M610 728H460"/>
<text class="label t-warn" x="476" y="718">502</text>
<circle class="dot" cx="66" cy="792" r="15"/><text class="num" x="66" y="797" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="788">One JSON log line</text>
<text class="sub" x="96" y="808">method, path, status, duration</text>
<path class="async" d="M610 792H1088"/>
<text class="label t-accent" x="956" y="782">stdout JSON</text>
<path class="sync" d="M48 856H112"/><text class="legend" x="124" y="861">sync call</text>
<path class="async" d="M264 856H328"/><text class="legend" x="340" y="861">async message</text>
<path class="fail" d="M696 856H760"/><text class="legend" x="772" y="861">failure path</text>
<path class="ok" d="M928 856H992"/><text class="legend" x="1004" y="861">result</text>
</svg>
